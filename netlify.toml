[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirect 301 — legacy URLs
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index-en.html"
  to = "/en/"
  status = 301
  force = true

[[redirects]]
  from = "/privacy-policy.html"
  to = "/privacy-policy/"
  status = 301
  force = true

[[redirects]]
  from = "/privacy-policy-en.html"
  to = "/en/privacy-policy/"
  status = 301
  force = true
